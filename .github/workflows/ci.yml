name: CI

# 三平台 CI（tasks.md T004/T005）。触发范围只覆盖真正影响构建的事件，
# 避免无意义的 runner 消耗。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动重跑（排查 flaky 或验证环境变化）
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的运行——CI 的价值在于最新的那次结果，
# 让排队中的旧运行跑完只是浪费 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需读仓库内容。体积 artifact 用 actions/upload-artifact
# 上传，不需要写 token 权限。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 让编译输出携带更多诊断信息，便于排查 CI 独有失败
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Lint：与平台无关，只跑一次（放 ubuntu 上最省额度）。
  # 拆成独立 job 是为了让"格式/静态检查失败"与"平台构建失败"在 CI 界面上
  # 一眼可辨，而不是埋在同一堆日志里。
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy + 依赖守卫
    runs-on: ubuntu-latest
    env:
      # 覆盖仓库根 rust-toolchain.toml 钉的 stable-x86_64-pc-windows-gnu
      # （该三元组在 ubuntu runner 上不存在，不覆盖则 rustup 报错——
      # build/s0-spike job 已用同款 RUSTUP_TOOLCHAIN 机制，见各自步骤注释）
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链（含 rustfmt/clippy 组件）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2

      # 格式化检查独立成步：失败时无需再等 clippy 跑完
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 守卫脚本自身的有效性先自检。理由：守卫失效是静默的，
      # 若它因正则/输出格式变化而"永远通过"，CI 会一直绿着却毫无防护。
      # 故先证明守卫能抓到违规，再用它检查真实依赖。
      - name: 守卫脚本自检（证明守卫有效）
        run: bash scripts/check-rquickjs-features.sh --self-test

      - name: rquickjs 依赖约束守卫
        run: bash scripts/check-rquickjs-features.sh

  # ---------------------------------------------------------------------------
  # 依赖图断言（tasks.md T096 / FR-039、宪章 IV）
  #
  # ## 为什么独立成 job
  #
  # 分支保护只能勾"某个 check"。依赖图是**架构级**约束，与"测试过了没"
  # 是两回事——独立 job 让"架构破了"在 CI 界面上一眼可辨，也让它自己能
  # 成为必需检查。
  #
  # ## 两层断言（都要）
  #
  # 1. `cargo build -p tome-core` —— **动态**：core 能不能在无上层时独立构建
  # 2. `cargo tree` 的传递依赖扫描 —— **静态**：引擎依赖图里有没有图形栈
  # 3. `cargo test --test dependency_graph` —— 星型无环、不依赖上层
  #    （测试在本地也能跑，CI 里跑一遍是防"本地跑了没推"）
  #
  # ## 为什么用 cargo tree 扫传递依赖
  #
  # 本地测试读的是**直接依赖表**；`cargo tree` 能看到传递闭包。
  # 有人引入一个"看起来无害"的 crate 而它内部依赖 winit 时，
  # 只有传递扫描能发现。
  # ---------------------------------------------------------------------------
  dependency-graph:
    name: 依赖图断言（FR-039）
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: dependency-graph

      # --- ① core 独立构建 -------------------------------------------------
      - name: tome-core 可独立构建
        run: |
          set -euo pipefail
          cargo build -p tome-core
          echo "tome-core 在无上层 crate 时独立构建通过"

      # --- ② 星型无环（走测试）---------------------------------------------
      - name: 星型无环断言
        run: cargo test -p tome-cli --test dependency_graph

      # --- ③ 传递依赖里无图形栈 --------------------------------------------
      #
      # 引擎 crate 的传递闭包不该出现图形栈。tome-reader 是合法依赖 wgpu
      # 的排版层，**不在**本检查范围（它不属引擎）。
      - name: 引擎传递依赖无图形栈
        shell: bash
        run: |
          set -euo pipefail

          # 图形栈的特征 crate 名（与 crates/tome-cli/tests/headless.rs 的
          # GRAPHICS_CRATES 保持一致；两处都写是因为一处是静态扫描、
          # 一处看传递闭包，覆盖面不同）
          forbidden="winit|wgpu|glutin|glfw|sdl2|^gtk|gtk-sys|cocoa|^objc|tao|egui|iced|slint|fltk|minifb|pixels|softbuffer|raw-window-handle"

          failed=0
          for crate in tome-core tome-rule tome-js tome-net tome-store tome-source tome-local; do
            echo "--- $crate 的传递依赖 ---"
            # `--edges normal` 排除 dev/build 依赖：它们不参与生产构建
            tree=$(cargo tree -p "$crate" --edges normal --prefix none --no-dedupe 2>/dev/null               | sed 's/ (\*)$//' | awk '{print $1}' | sort -u)

            hits=$(echo "$tree" | grep -E "$forbidden" || true)
            if [ -n "$hits" ]; then
              echo "::error::$crate 的传递依赖里出现图形栈：$hits"
              failed=1
            else
              echo "无图形栈"
            fi
          done

          # tome-cli 是组合根：render feature **默认开启**时装配 tome-reader（含 wgpu），
          # 这是 T032 裁决的合法形态；其无头保证由 headless 形态（--no-default-features）
          # 承载（FR-036 的语义是「引擎与 CLI 可无图形环境完整运行」，对应 feature-off
          # 构建），故对 tome-cli 检查其 headless 形态的传递闭包。
          echo "--- tome-cli（--no-default-features，headless 形态）的传递依赖 ---"
          tree=$(cargo tree -p tome-cli --no-default-features --edges normal --prefix none --no-dedupe 2>/dev/null             | sed 's/ (\*)$//' | awk '{print $1}' | sort -u)
          hits=$(echo "$tree" | grep -E "$forbidden" || true)
          if [ -n "$hits" ]; then
            echo "::error::tome-cli headless 形态的传递依赖里出现图形栈：$hits"
            failed=1
          else
            echo "无图形栈"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::引擎依赖图包含图形栈（FR-036 / SC-011）"
            exit 1
          fi
          echo "全部引擎 crate 的传递依赖均无图形栈"

      # --- ④ 引擎不依赖阅读器 ----------------------------------------------
      #
      # Tome-reader 依赖 wgpu，故"引擎依赖 reader"会间接把图形栈拉进引擎。
      # 这条是 ③ 的**充分性反证**：即便 ③ 因某种原因漏了，这条也会拦。
      # 名单与 ③ 一致：tome-cli 是组合根（它**必须**依赖 tome-reader 来装配
      # 渲染面），不在「引擎」之列——它的无头性由 ③ 的 headless 形态检查承载。
      - name: 引擎不依赖阅读器
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for crate in tome-core tome-rule tome-js tome-net tome-store tome-source tome-local; do
            tree=$(cargo tree -p "$crate" --edges normal --prefix none 2>/dev/null || true)
            if echo "$tree" | grep -qE "^tome-reader"; then
              echo "::error::$crate 依赖了 tome-reader（FR-039：引擎不得依赖上层）"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "引擎均不依赖 tome-reader"

  # ---------------------------------------------------------------------------
  # S0 spike（tasks.md T006-T008）—— 独立 job，独立 crate
  #
  # ## 为什么要独立成 job 而不是并进 build
  #
  # `spikes/s0/` 刻意脱离主 workspace（它是 eframe 图形依赖，绝不能进引擎的
  # 依赖图，否则违反 FR-036「引擎不得依赖图形环境」）。它的构建失败**不应**
  # 拖垮主 workspace 的 CI——那是"可行性门"的结论，不是主产品的回归。
  # 拆开让两者在 CI 界面上一眼可辨。
  #
  # ## 为什么也能跑 headless
  #
  # Linux runner 无 X11/Wayland，开窗口必失败。spike 的 `--headless` 路径
  # 只验证存储与脚本（不开窗口），故能在 CI 上产出"三平台编译通过"的证据。
  # 窗口验证留待有图形环境的机器（已在本机 Windows 实测，见 BASELINE.md）。
  # ---------------------------------------------------------------------------
  s0-spike:
    name: S0 spike (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链（${{ matrix.target }}）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      # Linux 上 eframe 需要窗口系统与图形库的开发头文件才能编译
      # （winit 的后端在编译期链接 x11/wayland 的客户端库）。
      # 只装构建依赖，不装完整桌面环境——headless 路径不需要能开窗口。
      - name: 安装 Linux 图形构建依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: spike 构建（默认臂：无 rquickjs）
        run: cargo build --release --manifest-path spikes/s0/Cargo.toml --target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      - name: spike 构建（spike-js 臂：含 rquickjs）
        run: cargo build --release --features spike-js --manifest-path spikes/s0/Cargo.toml --target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      - name: spike 单测
        run: cargo test --manifest-path spikes/s0/Cargo.toml --target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      # headless 路径验证存储 + 脚本沙箱，并断言"无网络外发"。
      # 该子命令不含任何 HTTP 调用（HTTP 走独立的 --http，需用户显式触发），
      # 故它的存在本身就是 FR-041/SC-012 的可执行证据。
      - name: spike headless 验证（含 rquickjs）
        run: cargo run --release --features spike-js --manifest-path spikes/s0/Cargo.toml --target ${{ matrix.target }} -- --headless
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      - name: 记录 spike 产物体积
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p size-report
          {
            echo "# S0 spike 产物体积（${{ matrix.name }}）"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- target: \`${{ matrix.target }}\`"
            echo
            echo '```'
          } > size-report/s0-spike-size-${{ matrix.name }}.txt

          # 三平台可执行文件后缀不同：Windows 是 .exe，其余无后缀
          binary="spikes/s0/target/${{ matrix.target }}/release/tome-s0-spike"
          if [ "${{ matrix.name }}" = "windows-gnu" ]; then
            binary="${binary}.exe"
          fi

          if [ -f "$binary" ]; then
            size_bytes=$(wc -c < "$binary")
            printf '%s  %s bytes (%s KiB)\n' "$binary" "$size_bytes" "$(( size_bytes / 1024 ))"
          else
            echo "未找到产物 $binary"
            exit 1
          fi
          echo '```' >> size-report/s0-spike-size-${{ matrix.name }}.txt
          cat size-report/s0-spike-size-${{ matrix.name }}.txt

      - name: 上传 spike 体积记录
        uses: actions/upload-artifact@v4
        with:
          name: s0-spike-size-${{ matrix.name }}
          path: size-report/
          overwrite: false
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 阅读层快照矩阵（T049 / SC-011 / SC-015）—— 三平台各自一个软件后端
  #
  # ## 为什么这个 job 独立于 build
  #
  # 快照需要**真正可用的图形后端**。CI runner 没有 GPU，故每平台各装一个
  # 软件光栅器：
  #
  # | 平台 | 后端 | 安装方式 |
  # |---|---|---|
  # | ubuntu | lavapipe (Vulkan) | `mesa-vulkan-drivers` 包 + `VK_DRIVER_FILES` 指到 icd |
  # | windows | lavapipe (Vulkan) | mesa-dist-win 预编译包（取 `*.dll` 与 icd json） |
  # | macos | Metal | 系统自带（**禁 GL**——wgpu 的 GL 后端在 macOS 上已弃用） |
  #
  # ## 为什么先跑 probe
  #
  # `examples/probe.rs` 先打印后端名。它把两类失败**分开**：
  #
  # - probe 打印 `PROBE OK backend=...` → 环境能离屏渲染，继续跑快照
  # - probe 退出码 3（`SKIPPED`）→ 环境**没有**后端，job **直接红**
  #
  # 若没有这一步，"没有后端"会表现为**所有快照测试都跳过**——而跳过是合法的
  # （本地无 GPU 的开发机就该跳过）。两者在日志里长得一样，于是 CI 会"绿着"
  # 而其实一张快照都没比。这正是 FR-053 要防的伪装（spikes/s2/BASELINE.md §10.1
  # 记的三次"全绿但没测到"）。
  #
  # ## 快照与平台的关系
  #
  # SC-011 明文"跨平台不比较像素，只比较排版结构"。故快照基线**按平台存**，
  # 本 job 用 `key: snapshots-${{ matrix.name }}` 的缓存隔离。三平台一致性由
  # `platform_consistency.rs` 的**指纹**（平台无关）承载，不由像素承载。
  # ---------------------------------------------------------------------------
  reader-snapshot:
    name: 阅读层快照（${{ matrix.name }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-lavapipe
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-lavapipe
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - name: macos-metal
            os: macos-latest
            target: aarch64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链（${{ matrix.target }}）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: reader-snapshot-${{ matrix.name }}

      # --- 后端安装（三平台各自）------------------------------------------
      - name: 安装 lavapipe（ubuntu）
        if: matrix.name == 'linux-lavapipe'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          # 让 loader 找到 lavapipe 的 ICD（软件 Vulkan 光栅器）
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          echo "lavapipe ICD: $icd"
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          # 禁用可能干扰的 layer
          echo "VK_LOADER_LAYERS_DISABLE=*" >> "$GITHUB_ENV"

      - name: 安装 lavapipe（windows）
        if: matrix.name == 'windows-lavapipe'
        shell: pwsh
        run: |
          # mesa-dist-win 的 release 包提供 lavapipe（vulkan_lvp.dll + icd json）。
          # 版本钉版：软件光栅器的行为随版本漂移，快照对该差异敏感。
          $version = '24.3.4'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          # 7z 在 windows runner 上可用（PATH 里自带）
          7z x $archive -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          $icd = Get-ChildItem -Path "$env:RUNNER_TEMP\mesa" -Recurse -Filter '*lvp*icd*.json' | Select-Object -First 1
          if (-not $icd) { Write-Error 'mesa-dist-win 包里找不到 lavapipe 的 ICD json' }
          Write-Host "lavapipe ICD: $($icd.FullName)"
          $dllDir = $icd.DirectoryName
          "PATH=$dllDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_LOADER_LAYERS_DISABLE=*" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: macOS 用 Metal（禁 GL）
        if: matrix.name == 'macos-metal'
        run: |
          set -euo pipefail
          # macOS runner 自带 Metal，无需安装。显式禁用 GL 后端：
          # wgpu 的 GL 后端在 macOS 上已弃用，且 OpenGL 在 macOS 的软件回退
          # 会给出与 Metal 不同的像素——用它会污染快照基线。
          echo "WGPU_BACKEND=metal" >> "$GITHUB_ENV"

      # --- 探针先行（后端不可用即 job 红，不静默跳过）-----------------------
      - name: 后端探针（打印后端名；无后端则 job 红）
        shell: bash
        run: |
          set -euo pipefail
          echo "--- 探针输出 ---"
          set +e
          output=$(cargo run -q -p tome-reader --example probe 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 0 ]; then
            echo "::error::后端探针失败（退出码 ${code}）——本平台矩阵配置有误（如 lavapipe 未装）"
            exit 1
          fi
          # 日志里必须能看到后端名（T049 验收子项）
          echo "$output" | grep -q 'PROBE OK backend=' || {
            echo "::error::探针未打印后端名——快照跑在哪个后端上不可知"
            exit 1
          }

      # --- 快照测试（必须**实际运行**，不得全跳过）--------------------------
      - name: 快照回归（SC-011）
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p tome-reader --test snapshot -- --nocapture 2>&1 | tee snapshot.log
          # 关键判据：本次**至少有一条快照真的比对了**。全跳过说明后端没用上，
          # 而"全跳过"在退出码上表现为成功——必须显式拦。
          #
          # 例外：`no_backend_reports_skipped_not_passed` 是**刻意的负例**，它用
          # `Backends::empty()` 主动造出"无后端"以验证 SKIPPED 的报告形态。
          # 故只统计**该用例之外**的 SKIPPED 行。
          skipped=$(grep -c 'SKIPPED' snapshot.log || true)
          # 从日志里剔除那条负例的输出（它的 SKIPPED 由设计产生）
          incidental=$(grep 'SKIPPED' snapshot.log | grep -vc 'noop not requested' || true)
          # 注意必须用大括号形式 ${skipped}：macos runner 的 bash 3.2 会把
          # 紧随其后的全角分号「；」并入变量名（实测报 `skipped；: unbound variable`），
          # linux 的 bash 5.x 不会——跨平台脚本里变量后接非 ASCII 字符一律加大括号。
          echo "SKIPPED 行总数：${skipped}；其中非负例：${incidental}"
          if [ "$incidental" -gt 0 ]; then
            grep 'SKIPPED' snapshot.log | grep -v 'noop not requested' || true
            echo "::error::快照出现非负例的 SKIPPED——后端未生效（快照未实际比对，FR-053 的诚实跳过不得在 CI 上出现）"
            exit 1
          fi
          # 正面证据：必须看到真实比对的结果（通过条数 > 0）
          grep -qE 'test result: ok\. [1-9]' snapshot.log || {
            echo "::error::快照测试一条都没跑（或全部跳过）"
            exit 1
          }

      # --- 三平台一致性指纹（SC-015）--------------------------------------
      - name: 三平台分页/滚动一致性（SC-015）
        shell: bash
        run: cargo test -p tome-reader --test platform_consistency -- --nocapture

      # --- 渲染管线与字形路径（含离屏读回，需要后端）-----------------------
      - name: 渲染管线与确定性（FR-048 / SC-012）
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p tome-reader --test render_pipeline --test render_deterministic -- --nocapture

      # --- 快照失败时上传三类文件供人工判断 --------------------------------
      - name: 失败时上传快照差异
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff-${{ matrix.name }}
          path: |
            crates/tome-reader/tests/snapshots/**/*.png
            snapshot.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # headless 形态（T049 / FR-052 / FR-036）—— 编译期无图形栈 + 能力错误退出码 3
  #
  # ## 这条 job 在证明什么
  #
  # `--no-default-features` 构建时，`tome-reader` 的渲染面在**编译期**消失
  # （依赖树里连 wgpu 都没有）。于是：
  #
  # 1. 整个 workspace 能在**无图形环境**下构建（引擎 + CLI 均可）
  # 2. `render` / `fonts` 子命令返回**退出码 3 + 结构化能力错误**（不伪装成功）
  # 3. `verify-layout` 这类纯计算子命令**照常可用**（SC-014：无图形环境全能力）
  #
  # ## 为什么与依赖图断言不重复
  #
  # `dependency-graph` job 查的是 `cargo tree` 的**静态闭包**；本 job 查的是
  # **运行期行为**（退出码、输出形态）。前者能发现"依赖被引入"，后者能发现
  # "代码在无渲染面时走错了分支"——两者覆盖面不同。
  # ---------------------------------------------------------------------------
  headless:
    name: headless 形态（无图形栈）
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: headless

      - name: 守卫（feature 门控方向）
        run: bash scripts/check-reader-features.sh

      - name: headless 构建
        run: cargo build --workspace --no-default-features

      - name: headless 测试（FR-052：无渲染面仍可完整构建）
        run: cargo test --workspace --no-default-features

      # 退出码 3 的断言：render / fonts 在无渲染面时必须诚实报能力错误
      #
      # ## 为什么断言的参数形态不止一种（T056）
      #
      # 只跑裸命令（`tome-cli render`）会漏掉**参数校验顺序**这一维：`render`
      # 曾因缺 `--out` 在子命令分支先报用法错误而退 2，而 `fonts`（无必需参数）
      # 直接退 3——两条对称的命令因"恰好有没有必需参数"分岔。故本步骤按
      # **参数合法性矩阵**断言：合法、缺必需项、非法取值、未知选项四种形态
      # 都必须退 3（PM 裁决：能力缺失压过用法错误——命令不存在则用法校验
      # 无从谈起）。三种形态分别命中三个不同的失败点，缺一则覆盖不全。
      - name: 断言 render/fonts 在 feature-off 时返回退出码 3
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find target/debug -maxdepth 1 -name 'tome-cli' -o -maxdepth 1 -name 'tome-cli.exe' | head -1)
          if [ -z "$binary" ]; then
            echo "::error::找不到 tome-cli 二进制（headless 构建未产出？）"
            exit 1
          fi
          echo "binary: $binary"

          # 参数形态矩阵。每项恰好测一个"若无短路会先报用法错误"的失败点。
          shapes=(
            "render"
            "render --out x.png"
            "render --theme sepia --page 0"
            "render --bogus-flag"
            "fonts"
            "fonts --bogus-flag"
          )

          for shape in "${shapes[@]}"; do
            # shellcheck disable=SC2086  # 形态串本就需要分词
            set +e
            "$binary" $shape 2>&1 | tee "headless-shape.log"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 3 ]; then
              echo "::error::\`$shape\` 在 headless 构建下应返回退出码 3（不支持能力），实测 $code"
              echo "::error::能力缺失须压过用法错误——命令不存在则参数校验无从谈起（FR-053/057/058）"
              exit 1
            fi
            grep -q 'offscreenRendering' "headless-shape.log" || {
              echo "::error::\`$shape\` 的错误应携带 offscreenRendering 能力标识（FR-057/058）"
              exit 1
            }
            echo "OK: \`$shape\` → 退出码 3 + 能力标识"
          done

          # 短路**不扩大**：拼错的子命令仍是用法错误（2），不该被误报成能力缺失。
          # 2 与 3 是不同信号（你写错了 / 本产品没有这项能力），吃掉前者会误导脚本。
          set +e
          "$binary" frobnicate 2>&1 | tee "headless-typo.log"
          typo_code=${PIPESTATUS[0]}
          set -e
          if [ "$typo_code" -ne 2 ]; then
            echo "::error::未知子命令应返回退出码 2（用法错误），实测 $typo_code——短路写成了通配？"
            exit 1
          fi
          echo "OK: 未知子命令仍是用法错误 2（短路未扩大）"

      # SC-014：纯计算子命令在无图形环境下**照常可用**
      - name: 断言 verify-layout 在 headless 下照常可用（SC-014）
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find target/debug -maxdepth 1 -name 'tome-cli' -o -maxdepth 1 -name 'tome-cli.exe' | head -1)
          # 退出码 0 或 1 都说明"命令跑起来了"（1 = 有语料未通过，是业务结论
          # 而非能力错误）。**绝不能是 3**——那是"能力不可用"。
          set +e
          "$binary" verify-layout --corpus crates/tome-reader/tests/corpus --format json >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::error::verify-layout 在 headless 下报了能力错误——它是纯计算，SC-014 要求可用"
            exit 1
          fi
          echo "verify-layout 在 headless 下可用（退出码 ${code}）"

  # ---------------------------------------------------------------------------
  # 三平台构建 + 测试 + 体积基线
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不应取消另外两个——同时看到三平台的真实结果，
      # 比省几个 runner 分钟更重要（三平台一致性是本项目的承诺）。
      fail-fast: false
      matrix:
        include:
          # Windows 用 gnu 而非 msvc：rquickjs 对 Windows-msvc 标 experimental
          # （research.md R1 缓解 3），且项目工具链为 stable-gnu + WinLibs MinGW。
          - name: windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # 显式指定本平台工具链。原因：仓库根的 rust-toolchain.toml 钉的是
      # stable-x86_64-pc-windows-gnu（为钉住 Windows 开发者的 ABI 选择），
      # 该三元组在 macos/ubuntu runner 上不存在，不覆盖会让 rustup 报错。
      # RUSTUP_TOOLCHAIN 优先级高于 toolchain 文件，是官方的覆盖机制。
      - name: 安装工具链（${{ matrix.target }}）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: cargo build
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      - name: cargo test
        run: cargo test --workspace --target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      # 依赖约束在三平台各查一次：feature 解析可能因目标平台的条件依赖
      # （[target.'cfg(...)'.dependencies]）而不同，只在 ubuntu 查会漏掉
      # Windows/macOS 特有的 feature 引入路径。
      - name: rquickjs 依赖约束守卫（${{ matrix.name }}）
        shell: bash
        run: bash scripts/check-rquickjs-features.sh
        env:
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}

      # -----------------------------------------------------------------------
      # 体积基线记录（T004 验收项）
      #
      # 为什么现在就记录：体积纪律要求"不引入与功能无关的体积膨胀"，
      # 而膨胀通常在某个不起眼的提交里悄悄发生。没有基线就没有"变大了"的
      # 判定依据。骨架阶段产物体积虽小且尚无二进制，但基线要**从第一天开始**，
      # 否则第一次可比较的数据点要等到很久以后。
      # -----------------------------------------------------------------------
      - name: 记录体积基线
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p size-report
          {
            echo "# 产物体积基线（${{ matrix.name }}）"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- target: \`${{ matrix.target }}\`"
            echo "- 生成时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```'
          } > size-report/size-${{ matrix.name }}.txt

          # 骨架阶段尚无二进制目标（tome-cli 只有 lib.rs，main 在 Phase 2 加入），
          # 故此处统计已产出的可执行文件；没有时明确记录"本阶段无二进制"，
          # 而不是留空——留空会让后续无法区分"没有产物"和"步骤失败"。
          found=0
          target_dir="target/${{ matrix.target }}/release"
          if [ -d "$target_dir" ]; then
            while IFS= read -r artifact; do
              [ -z "$artifact" ] && continue
              found=1
              size_bytes=$(wc -c < "$artifact")
              size_kib=$(( size_bytes / 1024 ))
              printf '%s  %s bytes (%s KiB)\n' "$artifact" "$size_bytes" "$size_kib"
            done < <(find "$target_dir" -maxdepth 1 -type f \( -name '*.exe' -o -perm -u+x \) ! -name '*.d' ! -name '*.rlib' 2>/dev/null | sort)
          fi

          if [ "$found" -eq 0 ]; then
            echo "（骨架阶段：本平台暂无二进制产物；二进制目标在 Phase 2 随 tome-cli 的 main 引入）"
          fi

          echo '```' >> size-report/size-${{ matrix.name }}.txt
          echo "--- 体积基线内容 ---"
          cat size-report/size-${{ matrix.name }}.txt

      - name: 上传体积基线 artifact
        uses: actions/upload-artifact@v4
        with:
          name: size-baseline-${{ matrix.name }}
          path: size-report/
          # 体积记录是长期观测数据，不应因 CI 重跑而互相覆盖
          overwrite: false
          retention-days: 90

      # 仅在失败时上传：成功路径无需留存
      - name: 失败时上传 debug 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ matrix.name }}
          path: |
            target/**/*.log
          if-no-files-found: ignore
          retention-days: 7
