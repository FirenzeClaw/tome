[workspace]
resolver = "2"
members = [
    "crates/tome-core",
    "crates/tome-net",
    "crates/tome-store",
    "crates/tome-js",
    "crates/tome-rule",
    "crates/tome-source",
    "crates/tome-local",
    "crates/tome-reader",
    "crates/tome-cli",
    "crates/tome-app",
]

[workspace.package]
# 版本与许可证为 workspace 级单一来源，各 crate 经 version.workspace / license.workspace 继承
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 内部 crate 统一在此登记，成员 crate 用 `tome-core = { workspace = true }` 引用。
# 这样依赖方向在 workspace 清单里一眼可读，且版本号只维护一处。
# 注意：此处登记 ≠ 添加第三方依赖。真实第三方依赖在 Phase 2 起按需引入。
tome-core = { path = "crates/tome-core" }
tome-net = { path = "crates/tome-net" }
tome-store = { path = "crates/tome-store" }
tome-js = { path = "crates/tome-js" }
tome-rule = { path = "crates/tome-rule" }
tome-source = { path = "crates/tome-source" }
tome-local = { path = "crates/tome-local" }
tome-reader = { path = "crates/tome-reader", default-features = false }
# `default-features = false`：tome-cli 的 `default = ["reader-render"]` 会经
# 转发打开 `tome-reader/render`（连 wgpu 一起）。**任何** workspace 表引用它
# 的地方都会连带拉进图形栈——2026-10-11 S3 T005 实测：tome-app 为复用 CLI 的
# PNG 编码器加了一条 dev-dependency，于是 `cargo test --workspace
# --no-default-features`（本应是"编译期无图形栈"的门）悄悄把 wgpu 装回了
# 依赖树，而那门**照样全绿**（测试数从 606 涨回 750，看起来只是"多跑了些
# 测试"）。
#
# 故此处关掉默认 feature，需要渲染面的消费者显式转发（tome-cli 自己作为
# primary package 构建时仍用自己的 default——`cargo build -p tome-cli` 不受
# 本行影响）。
tome-cli = { path = "crates/tome-cli", default-features = false }
# S3 应用外壳（第二个组合根）。注意它依赖的 `tome-reader` 同样经上面那条
# `default-features = false` 生效——`render` 面须由 tome-app 自己的
# `reader-render` feature 显式转发开启（成员使用点写 `default-features`
# 会被 cargo 忽略，2026-10-11 CI 依赖图断言实测）。
tome-app = { path = "crates/tome-app" }

[profile.release]
# 体积纪律（宪法「附加约束 · 体积纪律」）：<20MB 是目标基线，故 release 按体积最优配置。
# fat LTO + codegen-units=1 以编译时长换体积与运行速度；strip 去掉符号表。
lto = "fat"
codegen-units = 1
strip = true

# `panic = "unwind"`（S3 T003 由 `"abort"` 改；决策 R6，用户 2026-10-11 批准）
#
# ## 为什么改
#
# 001 选 `abort` 时尚无 GUI 进程——CLI 的失败语义是"报错退出"，去掉 unwind
# 表纯赚体积。S3 引入了**长驻 GUI 进程**：003 spec 的边缘情况明文要求
#
# > 排版/解析在单章上的失败 MUST 被隔离在该章……引擎 panic 经外壳兜底捕获
# > 并按错误分类呈现
#
# 而 `panic = "abort"` 下 panic 直接终止进程，`catch_unwind`（tome-app 引擎
# 线程的兜底边界，`crates/tome-app/src/engine/thread.rs`）在 release 里
# **不可能成立**——不是"没写对"，是该配置下这条路径不存在。故引擎线程的
# 兜底要求与 abort 直接冲突，取 unwind。
#
# 代价：unwind 表使二进制变大（实测见下），但体积基线已由用户裁决允许跨越
# （003 spec 假设节 / `specs/003-app-shell/size-report.md` 滚动记账）。
#
# ## 记账（本机实测，2026-10-11，x86_64-pc-windows-gnu）
#
# 同一份 `tome-cli` 源码、只切换本行（两次 release 全量构建）：
#
# | 配置 | `tome-cli.exe` 字节 | MiB |
# |---|---|---|
# | `abort`（改前） | 22,138,880 | 21.11 |
# | `unwind`（改后） | 23,513,088 | 22.42 |
# | **unwind 表代价** | **+1,374,208** | **+1.31** |
#
# T035 在 S3 收口时按同一口径复测，连同 eframe/winit/egui_extras 增量一并
# 入账 `specs/003-app-shell/size-report.md`。
panic = "unwind"

[workspace.lints.rust]
# 生产级护栏：unsafe 代码必须显式标注理由（配合各文件的 SAFETY 注释约定）
unsafe_code = "warn"

[workspace.lints.clippy]
# 与 AGENTS.md「禁止生产路径上的 unwrap()/expect()/panic!()」对齐。
#
# 注意**这里不能豁免测试**：`[workspace.lints]` 是 crate 级设置，对生产代码与
# 测试代码一视同仁。而 AGENTS.md 禁的是"**生产路径上**的 unwrap/expect/panic"，
# 测试里断言失败本就该 panic（否则测试框架无从报告失败）。
#
# 实现该区分的是 `.clippy.toml` 的 `allow-unwrap-in-tests` / `allow-expect-in-tests`
# / `allow-panic-in-tests`——Clipy 据此只在**非测试**目标上报告这三条 lint。
# 故此处保持 warn，测试豁免交给 clippy.toml，单一职责、不会两处打架。
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
