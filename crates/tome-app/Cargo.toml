[package]
name = "tome-app"
description = "tome 应用外壳：egui/eframe 桌面窗口、书架视图与阅读视图（S3）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# --- 接缝与 DTO（唯一允许的引擎依赖面，架构铁律）---
tome-core = { workspace = true }

# --- 组合根：外壳是第二个组合根 ---
#
# 与 tome-cli 同一授权：`crates/tome-cli/tests/dependency_graph.rs` 的
# `ENGINE_CRATES` 排除名单把组合根排除在外（T002 把 tome-app 一并加入），
# 因为组合根按定义要装配实现 crate 并注入接缝。
#
# `render` feature 经 `reader-render` 透传（见文件尾的 `[features]`）：
# 关掉它时 tome-reader 的渲染面在**编译期**消失，于是外壳的渲染入口
# 以结构化能力错误回应。关键形态：tome-reader 的 `default-features = false`
# 声明在**根 Cargo.toml 的 [workspace.dependencies] 表**——写在成员使用点
# 会被 cargo 忽略（2026-10-11 CI 依赖图断言实测抓出）。
tome-reader = { workspace = true }
# 本地书解析（TXT/EPUB/MOBI）与本地内容提供者（US1 的正文来源）
tome-local = { workspace = true }
# 存储层（T010 的 BookRepository 生产 adapter 在其中）
tome-store = { workspace = true }
# 净化管线的构造（`Cleaner` 的实现要吃 `ContentPipeline`）
tome-rule = { workspace = true }

# --- GUI 栈 ---
#
# eframe 钉 0.36.2（2026-09-08，当前最新稳定）：其 egui-wgpu 依赖 wgpu "30.0"，
# 与 tome-reader 实解的 wgpu 30.0.1 semver 相容，cargo 合并为**单份** wgpu 构建
# ——这是「S2 渲染管线在 egui 的 device 上直绘」（路径 A）的前提。
# 见 specs/003-app-shell/research-eframe.md Q1。
#
# 用 default features（含 wgpu 渲染器 / accesskit / default_fonts / wayland /
# x11）：wgpu 自 eframe 0.34 起即默认渲染器，走它不需要额外开关；
# `persistence` **不在** default 里（外壳不落 egui 自有的持久化文件，
# 书架/进度/设置一律走 tome-store）。
eframe = "0.36.2"
# 外壳直接引用 egui 类型（Visuals/Style/ViewportBuilder），不经 eframe 转发路径
# ——两 crate 版本必须一致，故钉同一版本线。
egui = "0.36.2"
# DataTable 等复合组件（书架网格与目录表）
egui_extras = "0.36.2"
# 单实例（spec 边缘情况：「第二个实例 MUST 激活已有实例」）。
# 选它的理由：三平台分支与 Wayland 抢焦降级已封装（research-eframe.md Q3）。
app-single-instance = "0.1.0"
# 跟随系统主题的 OS 探测（R7：设计系统无此机制，由外壳探测后映射 Day/Night token）
dark-light = "3.0.0"
# 原生文件选择对话框（FR-002 的"文件选择"路径）。
#
# ## 为什么用原生对话框而不是自绘文件浏览器
#
# SC-003 的口径是"导入到开始阅读 ≤3 步（步 = 用户动作）"。自绘浏览器会把
# 这件事变成"在应用里导航目录"（远超 3 步），而原生对话框是用户已经会用的
# 东西——它把"找到文件"这件事留在操作系统里，而不是重新实现一遍。
#
# 平台面：Windows（`IFileOpenDialog`）/ macOS（`NSOpenPanel`）/ Linux（xdg
# portal）。三者都由 rfd 封装，外壳不碰平台 API（`#![deny(unsafe_code)]`
# 因此仍成立）。
#
# ## 为什么关掉默认 feature 再显式开 `xdg-portal`
#
# rfd 在 Linux 上有两条后端：GTK3（要 `libgtk-3-dev`）与 xdg portal（纯 D-Bus，
# 只要会话总线）。CI 的 ubuntu job 只装了 `libwayland-dev` / `libxkbcommon-dev`
# / `libgl1-mesa-dev`（见 `.github/workflows/ci.yml`），**没有** GTK 开发头
# ——若走默认的 GTK 后端，CI 会因缺头文件而构建失败，而那个失败与本次改动
# 的真实风险毫无关系。xdg portal 后端不依赖任何系统开发包。
#
# `tokio` 是 xdg-portal 后端跑 D-Bus 调用所需的运行时；它本来就在依赖树里
# （`tome-net` 的 `RequestExecutor` 自持一个 tokio runtime）。
rfd = { version = "0.15.4", default-features = false, features = [
    "xdg-portal",
    "tokio",
] }
# `egui_wgpu::RenderState::create` 是 async；spike 的 headless 形态要驱动它。
# pollster 就是 eframe 自己的选择（eframe 的 `wgpu` feature 依赖它），
# 故这里不引入新的异步运行时形态——依赖树里本来就有。
pollster = "0.4"
# spike 的失败诊断走日志（GUI 进程在 Windows 上无控制台，stderr 看不到）。
log = "0.4"

# 消息协议与设置的序列化（data-model.md §1 的值类型）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外壳自有错误类型（AGENTS.md：每个 crate 拥有自己的错误类型）
thiserror = "2.0.21"

# `tome-cli` 只为**示例**（spike 落盘 PNG 复用它已验收的编码器）。写在
# `[dev-dependencies]` 而非 `[dependencies]`：外壳的**生产**依赖面里不该出现
# 另一个组合根，否则依赖图守卫会看到一个可疑的 `tome-app → tome-cli` 边。
# 见 `crates/tome-cli/src/png.rs` 的模块文档（它刻意不引 png crate）。
[dev-dependencies]
tome-cli = { workspace = true }
# 测试要构造临时文件/目录（字体注册的"存在/缺失"分支、spike 产物落盘）
tempfile = "3"


[features]
# 默认带渲染面（与 tome-cli 同形）。
#
# headless 形态 `cargo build -p tome-app --no-default-features` 必须**编译通过**
# 且渲染入口返回 UnsupportedCapability{capability:"offscreenRendering"}
# ——因为 `cargo test --workspace --no-default-features` 是既有的 workspace 级门。
default = ["reader-render"]
reader-render = ["tome-reader/render"]

# spike 示例（S3 T005）只在渲染面存在时才有意义——`required-features` 让
# `--no-default-features` 构建**跳过**它，而不是编译失败。这不是可选的润色：
# `cargo test` 默认会编译 examples，若不加这一条，workspace 的 headless 门
# 会因这个示例而变红。
[[example]]
name = "spike_render"
required-features = ["reader-render"]

[lints]
workspace = true
