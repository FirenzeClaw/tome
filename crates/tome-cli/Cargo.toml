[package]
name = "tome-cli"
description = "tome 验证器：CLI 子命令与差分测试入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 组合根：CLI 是唯一允许依赖全部实现 crate 的位置（见 plan.md 依赖图）
tome-core = { workspace = true }
tome-net = { workspace = true }
tome-store = { workspace = true }
tome-js = { workspace = true }
tome-rule = { workspace = true }
tome-source = { workspace = true }
tome-local = { workspace = true }

# CLI 输出是 JSON（contracts/cli.md：默认 `--format json`），
# 序列化只在这里用（core 的 DTO 刻意不派生 serde）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 测试要写临时书源文件（不污染仓库）
tempfile = "3"

[lints]
workspace = true
