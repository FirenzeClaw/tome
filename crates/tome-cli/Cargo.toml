[package]
name = "tome-cli"
description = "tome 验证器：CLI 子命令与差分测试入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 组合根：CLI 是唯一允许依赖全部实现 crate 的位置（见 plan.md 依赖图）
tome-core = { workspace = true }
tome-net = { workspace = true }
tome-store = { workspace = true }
tome-js = { workspace = true }
tome-rule = { workspace = true }
tome-source = { workspace = true }
tome-local = { workspace = true }
# S2 排版层（T048 的先行部分：`layout` / `render` / `fonts` 子命令）
#
# `render` feature 经 `reader-render` 透传（见文件尾的 `[features]`）：
# 关掉它时 `tome-reader` 的渲染面在**编译期**消失，于是 `render` 子命令
# 以能力错误 + 退出码 3 回应（contracts/cli.md §2.3、tasks.md 002 T032）。
# 关键形态：tome-reader 的 `default-features = false` 声明在**根 Cargo.toml 的
# [workspace.dependencies] 表**——写在成员使用点会被 cargo 忽略（2026-10-11
# CI 依赖图断言实测抓出：headless 构建闭包仍含 wgpu）。
tome-reader = { workspace = true }

# CLI 输出是 JSON（contracts/cli.md：默认 `--format json`），
# 序列化只在这里用（core 的 DTO 刻意不派生 serde）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# 测试要写临时书源/本地书文件（不污染仓库）
tempfile = "3"
# Phase 7 的 TXT 编码测试要用 GBK 编码样本
encoding_rs = "0.8.42"

[features]
# 默认带渲染面（开发/发布构建都需要它）。
#
# headless CI job 用 `--no-default-features` 构建并断言 `render` 子命令
# 返回退出码 3——那时依赖树里连 wgpu 都没有（宪法 IV / FR-052 的最强形态：
# 不是"运行时不用图形栈"，而是"编译期不存在"）。
default = ["reader-render"]
reader-render = ["tome-reader/render"]

[lints]
workspace = true
