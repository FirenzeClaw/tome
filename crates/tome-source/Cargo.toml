[package]
name = "tome-source"
description = "tome 书源管线：搜索、发现、详情、目录、正文、净化、换源与源检查"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tome-core = { workspace = true }
tome-net = { workspace = true }
tome-store = { workspace = true }
tome-js = { workspace = true }
tome-rule = { workspace = true }

# 书源定义是 JSON（FR-001 的三种导入渠道都产出 JSON 文本），
# 故解析需要 serde_json。plan.md 的技术栈已列入 serde/serde_json。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 本 crate 自身错误类型（AGENTS.md：每个 crate 拥有自己的错误类型）
thiserror = "2.0.21"

[dev-dependencies]
# T088 的端到端测试要构造"Android 备份 zip"样本（内存构造，不落盘）。
# 放 dev-dependencies：生产代码不需要构造 zip，只需要读它（在 tome-store 侧）。
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
