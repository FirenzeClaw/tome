[package]
name = "tome-store"
description = "tome 存储层：SQLite actor、迁移器、DAO、Pack 容器与图片缓存"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
# T064：`http_log` 的落点实现要满足 `tome_net::HttpLogSink`。
# 依赖方向仍是单向的（tome-store → tome-net 的 **trait**，而
# `HttpLogSink` 定义在 tome-net；tome-net 不依赖 tome-store）。
tome-net = { workspace = true }
tome-core = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3"
# 集成测试要直接操作数据库写夹具（用 rusqlite 的 params! 宏）。
# 依赖它而不是另加一个"测试专用"的 SQL 门面：那会是又一套需要同步维护的 API。
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true
