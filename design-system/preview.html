<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tome · 设计稿渲染预览</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* 预览容器：每屏固定 1440×900，用于像素核对 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1a1a1a; font-family: var(--font-ui); }
  /* ============================================================
     交互控制台（仅预览用，不属于设计稿本身）
     ============================================================ */
  body.lab { background: #121216; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  .labbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 10px 16px; background: #1b1b21; border-bottom: 1px solid #2a2a33;
            font-family: var(--font-ui); color: #c9c9d4; font-size: 12px; }
  .labbar .ttl { font-weight: 700; color: #ececf1; margin-right: 6px; }
  .labbar .grp { display: flex; align-items: center; gap: 6px; padding: 4px 8px;
                 background: #24242c; border-radius: 8px; }
  .labbar .grp > .k { opacity: .6; }
  .labbar button { background: #2e2e38; color: #c9c9d4; border: 1px solid #3a3a46; border-radius: 6px;
                   padding: 5px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .labbar button:hover { background: #3a3a46; color: #fff; }
  .labbar button.on { background: #D9794A; border-color: #D9794A; color: #15100c; font-weight: 600; }
  .labbar .range { width: 150px; accent-color: #D9794A; }
  .labbar .readout { font-family: var(--font-mono); font-size: 12px; min-width: 74px; }
  .labbar .hint { margin-left: auto; opacity: .5; font-size: 11.5px; }

  /* 舞台：可滚动的设计稿容器 */
  .viewport { flex: 1; overflow: auto; padding: 32px; display: block; }
  .viewport.centered { display: flex; align-items: center; justify-content: center; }
  .frame { box-shadow: 0 24px 60px -12px rgba(0,0,0,.6); border-radius: 10px; }
  .frame.dragging-width { transition: none; }

  /* 原有一屏一屏的静态网格模式（?grid=1） */
  .stage.gridmode { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  .stage.gridmode .frame { display: block !important; }

  .frame { width: 1440px; height: 900px; position: relative; overflow: hidden;
           background: var(--bg-base); color: var(--text-primary); }
  .frame.narrow { width: 820px; }
  /* 单屏截图模式：只显示被指定的那一屏，且紧贴视口左上角铺满。
     必须用绝对定位清零——若走流式布局，页面尺寸与 --window-size 不一致时
     会在视口边缘露出未绘制的黑色底色（污染归档截图）。 */
  body.single { background: #1a1a1a; }
  body.single .stage { position: absolute; top: 0; left: 0; }
  body.single .frame { display: none; margin: 0; box-shadow: none; border-radius: 0; }
  body.single .frame.active { display: block; }
  .frame > .app > .body { height: calc(100% - 56px); }
  .frame > .body { height: calc(100% - 56px); }

  /* ---------- 骨架 ---------- */
  .app { display: flex; flex-direction: column; width: 100%; height: 100%; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px;
            height: 56px; padding: 0 20px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); flex: 0 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .name { font-family: var(--font-reading); font-size: 17px; font-weight: 700; color: var(--text-primary); }
  .search { display: flex; align-items: center; gap: 8px; width: 380px; height: 34px; flex: 0 0 auto;
            background: var(--bg-inset); border-radius: var(--r-sm); padding: 0 12px; color: var(--text-tertiary); font-size: 13px;
            white-space: nowrap; overflow: hidden; }
  .search .ph { overflow: hidden; text-overflow: ellipsis; }
  .search .kbd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; flex: 0 0 auto; }
  .topactions { display: flex; align-items: center; gap: 6px; }
  .theme-btn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
               background: var(--bg-base); border-radius: var(--r-sm); font-size: 12.5px; color: var(--text-secondary); }
  .primary-btn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
                 background: var(--accent-primary); color: var(--text-inverse); border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500; }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--accent-secondary); }

  .body { display: flex; flex: 1; min-height: 0; }
  .sidebar { width: 240px; flex: 0 0 auto; background: var(--bg-surface); padding: 16px 12px;
             display: flex; flex-direction: column; gap: 2px; }
  .navgroup { font-size: 11px; font-weight: 500; color: var(--text-tertiary); padding: 8px 10px 4px; }
  .nav { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px;
         border-radius: var(--r-sm); font-size: 13.5px; color: var(--text-secondary); }
  .nav.active { background: var(--accent-soft); color: var(--accent-primary); font-weight: 500;
                box-shadow: inset 3px 0 0 var(--accent-primary); }
  .nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: .85; }
  /* 通用图标尺寸——必须对「所有」.ico 生效，不能只写成后代选择器（如 .nav .ico），
     否则搜索框等其他位置的 SVG 拿不到尺寸，会退回浏览器默认尺寸（300×150）并渲染成黑块。 */
  .ico { width: 16px; height: 16px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .spacer { flex: 1; }
  .divider { height: 1px; background: var(--border-subtle); margin: 8px 0; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-base); }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; padding: 24px 32px 14px; }
  .pagehead h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .pagehead .desc { margin-top: 6px; font-size: 13px; color: var(--text-secondary); }
  .headactions { display: flex; gap: 8px; }
  .ghost-btn { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
               background: var(--bg-surface); border-radius: var(--r-sm); font-size: 12.5px; color: var(--text-secondary); }
  .cta { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
         background: var(--accent-primary); color: var(--text-inverse); border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500; }

  .filterbar { display: flex; align-items: center; gap: 8px; padding: 0 32px 16px; }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--bg-inset); border-radius: var(--r-sm); }
  .seg > span { height: 26px; display: flex; align-items: center; padding: 0 12px; border-radius: var(--r-xs);
                font-size: 12.5px; color: var(--text-secondary); }
  .seg > span.on { background: var(--bg-elevated); color: var(--text-primary); font-weight: 500; }
  .chipbox { display: flex; gap: 6px; margin-left: auto; }
  .chip { display: flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 999px;
          font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border-subtle); }
  .chip.on { background: var(--accent-soft); color: var(--accent-primary); font-weight: 500; border-color: transparent; }

  /* ---------- 书架网格 ---------- */
  .grid { flex: 1; padding: 0 32px 24px; display: grid; gap: 18px 24px;
          grid-template-columns: repeat(auto-fill, minmax(clamp(132px,11vw,168px), 1fr));
          align-content: start; overflow: hidden; }
  .book { display: flex; flex-direction: column; gap: 8px; }
  .cover { position: relative; height: 200px; border-radius: var(--r-md); overflow: hidden;
           display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; }
  .cover .t { font-family: var(--font-reading); font-weight: 700; color: #F5EEDC; line-height: 1.2; letter-spacing: .5px; }
  .badge { position: absolute; top: 10px; left: 10px; height: 22px; display: flex; align-items: center;
           padding: 0 8px; border-radius: var(--r-xs); font-size: 11px; font-weight: 500; background: var(--accent-clash); color: #2E2418; }
  .badge.done { background: var(--state-success); color: #F5EEDC; }
  .badge.off  { background: #8A7658; color: #F5EEDC; }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.35); }
  .prog i { display: block; height: 100%; background: var(--accent-clash); }
  .book .author { font-size: 12px; color: var(--text-tertiary); }

  /* ---------- 表格 ---------- */
  .tablewrap { flex: 1; padding: 0 32px 24px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; background: var(--bg-surface);
          border: 1px solid var(--border-subtle); border-radius: var(--r-md); overflow: hidden; }
  thead th { background: var(--bg-inset); text-align: left; font-size: 12px; font-weight: 500;
             color: var(--text-secondary); height: 40px; padding: 0 16px; }
  tbody td { height: 48px; padding: 0 16px; font-size: 13px; border-top: 1px solid var(--border-subtle); }
  tbody td.num { text-align: right; font-family: var(--font-mono); font-size: 12px; }
  tbody td.url { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  tbody td.grp { font-size: 12px; color: var(--text-secondary); }
  tbody td.act { text-align: right; color: var(--accent-primary); font-size: 12px; font-weight: 500; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--state-success); }
  .dot.warn { background: var(--state-warning); }
  .dot.err  { background: var(--state-error); }
  .ok { color: var(--state-success); }
  .mid { color: var(--state-warning); }
  .bad { color: var(--state-error); }

  /* ---------- 阅读器 ---------- */
  .reader { display: flex; flex-direction: column; height: 100%; background: var(--bg-reading); }
  .rtop { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px; flex: 0 0 auto; }
  .rtop .l, .rtop .r { display: flex; align-items: center; gap: 14px; }
  .rtop .r { gap: 8px; }
  .rback { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .rbook { font-size: 13px; font-weight: 500; }
  .rprog { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  .ricon { width: 18px; height: 18px; stroke: var(--text-secondary); fill: none; stroke-width: 1.7; }
  .rpage { flex: 1; min-height: 0; padding: 40px 80px; display: flex; justify-content: center; overflow: hidden; }
  .measure { width: 620px; display: flex; flex-direction: column; gap: 20px; }
  .measure.wide { width: 100%; }
  .chapno { text-align: center; font-size: 13px; font-weight: 500; color: var(--text-tertiary); }
  .chaptitle { text-align: center; font-family: var(--font-reading); font-size: 30px; font-weight: 700; line-height: 1.45; }
  .rule { width: 48px; height: 2px; background: var(--border-strong); border-radius: 1px; margin: 0 auto; }
  .p { font-family: var(--font-reading); font-size: 19px; line-height: 1.85; text-align: justify; }
  .rfoot { display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 0 40px;
           font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); flex: 0 0 auto; }

  /* 双页 */
  .spread { flex: 1; min-height: 0; display: flex; gap: 64px; padding: 40px 60px; justify-content: center; overflow: hidden; }
  .spread .measure { width: 620px; }
  .spread .seamwrap { position: relative; }
  .seam { position: absolute; left: -32px; top: 0; bottom: 0; width: 1px; background: var(--border-subtle); }

  /* ---------- 设置 ---------- */
  .settings { flex: 1; overflow: hidden; padding: 0 32px 24px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-md);
          padding: 18px 20px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 16px; height: 36px; }
  .row .lbl { flex: 1; font-size: 13px; color: var(--text-secondary); }
  .row .val { font-size: 13px; font-weight: 500; }
  .row .valnum { font-family: var(--font-mono); font-size: 12px; width: 60px; }
  .slider { width: 240px; height: 4px; border-radius: 2px; background: var(--bg-inset); position: relative; }
  .slider i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; background: var(--accent-primary); }
  .note { font-size: 12px; color: var(--text-tertiary); line-height: 1.7; }
  .themecards { display: flex; gap: 12px; }
  .tcard { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .swatch { height: 64px; border-radius: var(--r-md); padding: 10px; display: flex; align-items: center; gap: 6px;
            border: 2px solid transparent; }
  .swatch i { width: 28px; height: 28px; border-radius: var(--r-sm); display: block; }
  .tcard.sel .swatch { border-color: var(--accent-primary); }
  .tcard .tlbl { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .tcard .tlbl small { font-weight: 400; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11px; }
  .drow { display: flex; align-items: center; gap: 10px; height: 44px; border-top: 1px solid var(--border-subtle); }
  .drow .folder { width: 16px; height: 16px; stroke: var(--accent-clash); fill: none; stroke-width: 1.7; }
  .drow .path { flex: 1; font-family: var(--font-mono); font-size: 12.5px; }
  .drow .cnt { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
</style>
</head>

const R4 = '晚风忽起，吹得满院书页哗哗作响。陈平安低头看着怀里的《观湖录》，忽然觉得，这书院里的每一页纸，都比镇上的米价要沉。';

function sidebar(active) {
  const items = [
    ['shelf','书架','128'], ['globe','书源管理','42'],
    ['folder','本地库','36'], ['chart','阅读统计','']
  ];
  let h = '<aside class="sidebar"><div class="navgroup">资产</div>';
  for (const [ic, nm, ct] of items) {
    h += `<div class="nav${active===nm?' active':''}">${ICO[ic]}<span>${nm}</span>${ct?`<span class="count">${ct}</span>`:''}</div>`;
  }
  h += '<div class="spacer"></div><div class="divider"></div>'
     + `<div class="nav${active==='设置'?' active':''}">${ICO.gear}<span>设置</span></div></aside>`;
  return h;
}

function topbar(themeName) {
  return `<header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 5.5C4 4.67 4.67 4 5.5 4H11v15H5.5C4.67 19 4 18.33 4 17.5V5.5Z" stroke="var(--accent-primary)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M20 5.5C20 4.67 19.33 4 18.5 4H13v15h5.5c.83 0 1.5-.67 1.5-1.5V5.5Z" stroke="var(--accent-primary)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 4v15" stroke="var(--accent-clash)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="name">tome</span>
    </div>
    <div class="search">${ICO.search}<span class="ph">搜索书架、书源或输入关键词发现新书</span><span class="kbd">Ctrl K</span></div>
    <div class="topactions">
      <div class="theme-btn">${ICO.moon}<span>${themeName}</span></div>
      <div class="primary-btn">${ICO.plus}<span>导入书籍</span></div>

    </div>
  </header>`;
}

function shelf(themeName) {
  let books = BOOKS.map(b => {
    /* 封面书名按字数选字号：2 字用大字，4 字以上收小以免溢出 200px 高的封面 */
    const fs = b.t.length <= 2 ? 30 : b.t.length <= 3 ? 26 : b.t.length <= 4 ? 22 : 18;
    return `
    <div class="book">
      <div class="cover" style="background:linear-gradient(135deg, ${b.g[0]}, ${b.g[1]})">
        <span class="badge ${b.b==='读完'?'done':b.b==='未读'?'off':''}">${b.b}</span>
        <span class="t" style="font-size:${fs}px">${b.t}</span>
        ${b.p>0?`<span class="prog"><i style="width:${b.p}%"></i></span>`:''}
      </div>
      <div class="author">${b.a}</div>
    </div>`;
  }).join('');
  return `<div class="app">${topbar(themeName)}<div class="body">${sidebar('书架')}
    <div class="content">
      <div class="pagehead">
        <div><h1>书架</h1><div class="desc">128 本藏书 · 3 本在读 · 昨日阅读 1 小时 12 分</div></div>
      </div>
      <div class="filterbar">
        <div class="seg"><span class="on">全部</span><span>在读</span><span>已读完</span><span>本地</span></div>
        <div class="chipbox"><span class="chip on">最近阅读</span><span class="chip">中</span></div>
      </div>
      <div class="grid">${books}</div>
    </div></div></div>`;
}

  return `<div class="app">${topbar(themeName)}<div class="body">${sidebar('书源管理')}
    <div class="content">
      <div class="pagehead">
        <div><h1>书源管理</h1><div class="desc">42 个书源 · 38 个可用 · 最近检查 2 小时前</div></div>

function reader({ spread = false, narrow = false, themeName }) {
  const mode = spread ? '双页' : '单页';
  const left = `<div class="measure">
      <div class="chapno">第二十一章</div>
      <div class="chaptitle">观湖书院</div>
      <div class="rule"></div>
      <p class="p">${P1}</p><p class="p">${P2}</p><p class="p">${P3}</p><p class="p">${P4}</p>
    </div>`;
  const right = `<div class="measure">
      <div class="chapno">（续上页）</div>
      <p class="p">${R1}</p><p class="p">${R2}</p><p class="p">${R3}</p><p class="p">${R4}</p>
    </div>`;
  const pages = spread
    ? `<div class="spread">${left}<div class="seamwrap"><span class="seam"></span></div>${right}</div>`
    : `<div class="rpage"><div class="measure${narrow?' wide':''}">
         <div class="chapno">第二十一章</div>
         <div class="chaptitle">观湖书院</div>
         <div class="rule"></div>
         <p class="p">${P1}</p><p class="p">${P2}</p><p class="p">${P3}</p><p class="p">${P4}</p>
       </div></div>`;

  return `<div class="reader">
    <header class="rtop">
      <div class="l">
        <span class="rback">${ICO.left}<span>书架</span></span>
        <span class="rbook">剑来 · 第二十一章 观湖书院</span>

      <div class="r">
        <span class="rprog">第 21 / 486 章 · 4.3%${spread?' · 双页':''}</span>
        <div class="seg" style="height:30px"><span class="${spread?'':'on'}" style="height:24px;font-size:12px">自动</span><span class="${spread?'':'on'}" style="height:24px;font-size:12px">单页</span><span class="${spread?'on':''}" style="height:24px;font-size:12px">双页</span></div>
        ${ICO.font}${ICO.moon}${ICO.dots}
      </div>
    </header>
    ${pages}
    <footer class="rfoot">
      <span>4.3%</span>
      <span>第一章 观湖书院 · 第 ${spread?'2-3':'1'} 页</span>
      <span>剩余 1 小时 4 分</span>
    </footer>
  </div>`;
}

          <div class="drow"><svg class="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="path">D:\\Books\\科幻译文</span><span class="cnt">312 本</span></div>

const SHOTS = [
  { id:'shelf-day',    label:'书架 · 日间',        theme:'day',   html: () => shelf('夜间') },
  { id:'shelf-night',  label:'书架 · 夜间',        theme:'night', html: () => shelf('日间') },
  { id:'reader-day',   label:'阅读器 · 单页 · 日间', theme:'day',  html: () => reader({ themeName:'夜间' }) },
  { id:'reader-spread',label:'阅读器 · 双页 · 日间', theme:'day',  html: () => reader({ spread:true, themeName:'夜间' }) },
  { id:'reader-narrow',label:'阅读器 · 窄窗单页 · 日间', theme:'day', narrow:true, html: () => reader({ narrow:true, themeName:'夜间' }) },
  { id:'sources-day',  label:'书源管理 · 日间',    theme:'day',   html: () => sources('夜间') },
  { id:'sources-night',label:'书源管理 · 夜间',    theme:'night', html: () => sources('日间') },
  { id:'settings-day', label:'设置 · 日间',        theme:'day',   html: () => settings('夜间') },
  { id:'settings-night',label:'设置 · 夜间',       theme:'night', html: () => settings('日间') }
];

/* ============================================================
   三种呈现模式：
   - 默认：交互控制台（可切界面/主题/宽度，实时看响应式与单双页切换）
   - ?shot=<id>：单屏静态，供 Edge 无头截图（逐屏归档）
   - ?grid=1：全部画板平铺，供总览
   ============================================================ */
const params = new URLSearchParams(location.search);
const wantShot = params.get('shot');
const gridMode = params.get('grid') === '1';
const stage = document.getElementById('stage');

if (wantShot) {
  /* --- 单屏静态模式（截图用） --- */
  document.body.classList.add('single');
  stage.innerHTML = SHOTS.filter(s => s.id === wantShot).map(s =>
    `<div class="frame ${s.narrow?'narrow':''} active" id="${s.id}" data-theme="${s.theme}">${s.html()}</div>`
  ).join('');
} else if (gridMode) {
  /* --- 平铺总览模式 --- */
  document.body.classList.add('lab');
  stage.classList.add('gridmode');
  stage.innerHTML = SHOTS.map(s =>
    `<div class="frame ${s.narrow?'narrow':''}" id="${s.id}" data-theme="${s.theme}">${s.html()}</div>`
  ).join('');
  wrapViewport();
} else {
  /* --- 交互控制台模式（主入口） --- */
  document.body.classList.add('lab');
  buildLab();
}

/* 平铺模式需要一个可滚动容器 */
function wrapViewport() {
  const vp = document.createElement('div');
  vp.className = 'viewport';
  document.body.appendChild(vp);
  vp.appendChild(stage);
}

function buildLab() {
  /* 控制台 */
  const bar = document.createElement('div');
  bar.className = 'labbar';
  bar.innerHTML = `
    <span class="ttl">tome 设计预览</span>
    <span class="grp"><span class="k">界面</span><span id="navbtns"></span></span>
    <span class="grp"><span class="k">主题</span>
      <button data-theme-btn="day">羊皮卷轴</button>
      <button data-theme-btn="night">纯黑基底</button>
    </span>
    <span class="grp"><span class="k">宽度</span>
      <input class="range" id="wrange" type="range" min="560" max="2400" step="20" value="${+(params.get('w') || 1440)}">
      <span class="readout" id="wout">${+(params.get('w') || 1440)} px</span>
    </span>
    <span class="grp"><span class="k">分页</span>
      <button data-fit="auto">自动</button>
      <button data-fit="single">单页</button>
      <button data-fit="spread">双页</button>
    </span>
    <span class="hint" id="hint"></span>`;
  document.body.appendChild(bar);

  const vp = document.createElement('div');
  vp.className = 'viewport centered';
  document.body.appendChild(vp);

  /* 界面按钮 */
  const PAGES = [
    { key:'shelf',    label:'书架' },
    { key:'reader',   label:'阅读器' },
    { key:'sources',  label:'书源管理' },
    { key:'settings', label:'设置' }
  ];
  const navbtns = bar.querySelector('#navbtns');
  navbtns.innerHTML = PAGES.map(p => `<button data-page="${p.key}">${p.label}</button>`).join('');

  let curPage = params.get('page') || 'reader';   // 默认打开阅读器——本次需求的核心
  let curTheme = params.get('theme') === 'night' ? 'night' : 'day';
  let curW = +(params.get('w') || 1440);
  let curFit = ['auto','single','spread'].includes(params.get('fit')) ? params.get('fit') : 'auto';

  const el = document.createElement('div');
  el.className = 'frame';
  vp.appendChild(el);

  const themeNameFor = t => (t === 'day' ? '夜间' : '日间');

  /* ============================================================
     单/双页自动判定 —— 与 design-system/MASTER.md §5.2 一致：
     判据是「版心可用宽度能否容纳两个不小于 36em 的行长」，
     而非固定 px 断点。em 随阅读字号缩放（此处 19px）。
     ============================================================ */
  const READING_FS = 19;               // 阅读字号
  const MEASURE_EM  = 36;              // 单栏理想版心 = 36em
  const GUTTER      = 64;              // 双页中缝
  const PAGE_PAD_X  = 60;              // 双页时版心区左右内边距

  function measurePx() { return MEASURE_EM * READING_FS; }          // 36em → 684px
  function autoSpread(availW) {
    const usable = availW - PAGE_PAD_X * 2;
    return usable >= measurePx() * 2 + GUTTER;
  }

  function render() {
    /* 阅读器宽度 = 画板宽度 - 侧栏 240 */
    const avail = curW - 240;
    const isReader = curPage === 'reader';
    const spread = isReader && (curFit === 'spread' || (curFit === 'auto' && autoSpread(avail)));

    el.style.width = curW + 'px';
    el.style.transition = 'width .18s ease';
    el.setAttribute('data-theme', curTheme);

    if (curPage === 'shelf')         el.innerHTML = shelf(themeNameFor(curTheme));
    else if (curPage === 'sources')  el.innerHTML = sources(themeNameFor(curTheme));
    else if (curPage === 'settings') el.innerHTML = settings(themeNameFor(curTheme));
    else el.innerHTML = reader({ spread, narrow: !spread, themeName: themeNameFor(curTheme) });

    /* 状态回显 */
    bar.querySelector('#wout').textContent = curW + ' px';
    const threshold = measurePx() * 2 + GUTTER + PAGE_PAD_X * 2 + 240;
    if (isReader) {
      const mode = spread ? '双页' : '单页';
      bar.querySelector('#hint').textContent =
        `${mode} · 版心 ${measurePx()}px(36em) · 自动切换阈值 ≈ ${Math.round(threshold)}px`;
    } else {
      bar.querySelector('#hint').textContent = `自动切换阈值 ≈ ${Math.round(threshold)}px（切到阅读器可见）`;
    }

    /* 按钮态 */
    navbtns.querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.page === curPage));
    bar.querySelectorAll('[data-theme-btn]').forEach(b =>
      b.classList.toggle('on', b.dataset.themeBtn === curTheme));
    bar.querySelectorAll('[data-fit]').forEach(b =>
      b.classList.toggle('on', b.dataset.fit === curFit));
  }

  navbtns.addEventListener('click', e => {
    const p = e.target.closest('[data-page]'); if (!p) return;
    curPage = p.dataset.page; render();
  });
  bar.querySelectorAll('[data-theme-btn]').forEach(b =>
    b.addEventListener('click', () => { curTheme = b.dataset.themeBtn; render(); }));
  bar.querySelectorAll('[data-fit]').forEach(b =>
    b.addEventListener('click', () => { curFit = b.dataset.fit; render(); }));
  bar.querySelector('#wrange').addEventListener('input', e => {
    curW = +e.target.value; render();
  });

  render();
}

/* 标记渲染完成，供外部检测 */
document.documentElement.setAttribute('data-rendered', 'true');
</script>
</body>
